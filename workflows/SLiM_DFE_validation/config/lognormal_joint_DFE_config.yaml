# Small-scale test configuration for dadi_DFE_inference.py (lognormal joint
# mixture DFE). Mirrors DFE_inference/lognormal_joint_DFE_config.yaml, with
# num_opts reduced for a fast local test.
configs:
  - name: "lognormal_joint_mixture_DFE_test"
    DFE_type: "mixture" # 1d, 2d, or mixture
    theta_ratio: 2.5 # ratio of theta_ns to theta_syn
    initial_params: [1.35, 2.6, 0.01, 0.075] # mu, sigma, rho, w
    lower_bounds: [0.01, 0.01, 0.0001, 0.0001]
    upper_bounds: [10, 10, 0.9999, 1]
    fixed_params: [null, null, 0, null] # fix rho=0 for mixture model
    sel_dist_1d: "lognormal"
    sel_dist_2d: "lognormal"
    num_opts: 3
    ll_tol: 0.001
    output_dir: "results/DFE_inference/dfe_results/lognormal_joint_test"
    dfe_param_names: ["mu", "sigma", "rho", "w"]
