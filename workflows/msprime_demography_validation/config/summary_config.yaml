# Small-scale test configuration for summarize_inference_results.py
# eps_l and num_bootstraps are reduced from the production example
# (summary_configs_ex.yaml) to keep GIM uncertainty computation fast locally.
ploidyType: "allotetraploid"
model: "two_epoch" # full model for uncertainties and LRT
nested_model: "two_epoch_noHE" # nested model for uncertainties of nested inferences
pts_l: [51, 61, 71] # grid points for numerical integration (must match inference_config.yaml)
folded: True
collapsed_ids: [0, 1]
eps_l: [0.01] # single eps for a fast test (production used [0.1, 0.01, 0.001])
nested_indices: [2] # H is nested in this example
weights: [0.5, 0.5]
true_params: [0.3, 0.75, 0.002] # T_WGD, nu, H matching demography_config.yaml
